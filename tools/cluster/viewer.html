<!doctype html>
<!--
  Scene cluster viewer. Opens straight off the disk - no server, no network,
  no CDN.

  That is not a style choice. These are screenshots of a real phone in real
  use, they live on the machine that drives the device, and they must never
  reach the repository, which is public. Everything this page needs is either
  inline below or in clusters.js beside it.

  clusters.js is a SCRIPT and not a JSON file for the same reason: over
  file:// a browser blocks fetch() but not <script src>.

  Two things this page deliberately does not show.

  It shows no hand-written class. There used to be a shape and a scene name
  on every tile and a purity bar on every cluster, all of it scored against a
  class list written before any data existed. That list did not survive the
  data and capture no longer produces it.

  It shows no app name. Nothing identifying the app enters the vector,
  because nothing about the app predicts the scene - and showing it here
  would invite exactly the reasoning the vector was built to avoid.

  What is left is the geometry, the screenshots, and a box to write a name in
  after looking. That is the whole point: the clustering sets up the looking.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scene Clusters</title>
<style>
  :root {
    --bg:#ffffff; --fg:#16181d; --dim:#6b7280; --line:#e3e6eb;
    --card:#f7f8fa; --accent:#2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0f1115; --fg:#e6e8ec; --dim:#9aa1ad; --line:#272b33;
      --card:#171a20; --accent:#60a5fa;
    }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5
    -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .wrap { max-width:1280px; margin:0 auto; padding:24px 16px 72px; }
  h1 { font-size:22px; margin:0 0 4px; }
  h2 { font-size:15px; margin:0; }
  .tiny { font-size:12px; color:var(--dim); }
  .sum { display:flex; flex-wrap:wrap; gap:18px; margin:14px 0 26px;
    padding:14px 16px; background:var(--card); border:1px solid var(--line);
    border-radius:10px; }
  .sum div b { display:block; font-size:19px; }
  .cl { border:1px solid var(--line); border-radius:12px; margin:0 0 22px;
    overflow:hidden; background:var(--card); }
  .hd { display:flex; flex-wrap:wrap; align-items:center; gap:14px;
    padding:12px 16px; border-bottom:1px solid var(--line); }
  .id { font-size:17px; font-weight:700; }
  .geo { font-size:12px; color:var(--dim); font-family:ui-monospace,
    "SF Mono", Menlo, Consolas, monospace; }
  .nm { margin-left:auto; display:flex; gap:6px; }
  .nm input { font:inherit; padding:5px 9px; border:1px solid var(--line);
    border-radius:7px; background:var(--bg); color:var(--fg); width:190px; }
  .nm button { font:inherit; padding:5px 11px; border:1px solid var(--line);
    border-radius:7px; background:var(--bg); color:var(--fg); cursor:pointer; }
  .grid { display:grid; gap:8px; padding:14px 16px;
    grid-template-columns:repeat(auto-fill, minmax(104px, 1fr)); }
  .shot img { width:100%; display:block; border-radius:6px;
    background:var(--line); aspect-ratio:1316/2832; object-fit:cover; }
  .shot .cap { font-size:10px; color:var(--dim); text-align:center;
    padding-top:3px; font-family:ui-monospace, Menlo, Consolas, monospace; }
  .none { opacity:.72; }
  .bar { height:4px; background:var(--line); border-radius:3px; width:90px; }
  .bar i { display:block; height:100%; background:var(--accent);
    border-radius:3px; }
  footer { margin-top:30px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Scene clusters</h1>
  <div class="tiny" id="sub"></div>
  <div class="sum" id="sum"></div>
  <div id="out"></div>
  <footer class="tiny">
    Every scene is shown. Ordered from the centre of its cluster outwards, so
    the last tiles are where it frays. Write a name once the pictures agree on
    one, then Download to keep them.
    <button id="dl" style="margin-left:10px">Download names</button>
  </footer>
</div>
<script src="clusters.js"></script>
<script>
(function () {
  // clusters.js declares `const DATA`, and a top-level const is NOT a
  // property of window - it lives in the script's lexical scope. Reading
  // window.CLUSTERS found undefined every time, which is why the page came
  // up with every count at zero and no tiles at all.
  var D = (typeof DATA !== "undefined" && DATA) ? DATA : {};
  var clusters = (D.clusters || []).slice().sort(function (a, b) {
    if (a.id === -1) return 1; if (b.id === -1) return -1; return a.id - b.id;
  });
  var labels = {};
  try { labels = JSON.parse(localStorage.getItem("arkui.names." + D.session) || "{}"); }
  catch (e) { labels = {}; }

  function esc(s) {
    return String(s === undefined || s === null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
  // Must match thumb_name() in cluster.py.
  function thumb(shot) {
    return shot ? "thumbs/" + shot.replace(/\.\.\//g, "").replace(/\//g, "__")
      .replace(".png", ".jpg") : "";
  }

  document.getElementById("sub").textContent =
    (D.session || "") + " · " + (D.scenes || 0) + " distinct scenes · "
    + (D.samples || 0) + " samples";

  var real = clusters.filter(function (c) { return c.id !== -1; });
  var noise = clusters.filter(function (c) { return c.id === -1; });
  var nOut = noise.length ? noise[0].n : 0;
  var sum = [
    ["clusters", real.length],
    ["scenes clustered", real.reduce(function (a, c) { return a + c.n; }, 0)],
    ["fitted none", nOut],
    ["silhouette", (D.silhouette === undefined || D.silhouette === null)
      ? "–" : D.silhouette]
  ];
  document.getElementById("sum").innerHTML = sum.map(function (p) {
    return "<div><b>" + esc(p[1]) + "</b><span class='tiny'>" + esc(p[0]) + "</span></div>";
  }).join("");

  var KEY = [["rs_node_den","den"], ["rs_depth_mean","depth"], ["rs_leaf_frac","leaf"],
             ["rs_repeat_n","rep"], ["rs_text_frac","text"], ["rs_image_frac","img"],
             ["rs_paint_frac","paint"], ["rs_scroller","scroll"],
             ["rs_surface_tag","surface"]];

  function block(c) {
    var isNone = c.id === -1;
    var geo = KEY.map(function (k) {
      var v = (c.medians || {})[k[0]];
      return k[1] + " " + (v === undefined ? "–" : v);
    }).join("   ");
    var h = "<div class='cl" + (isNone ? " none" : "") + "'><div class='hd'>" +
      "<span class='id'>" + (isNone ? "fitted no cluster" : "cluster " + c.id) + "</span>" +
      "<span class='tiny'>" + c.n + " scenes · " + c.dwell + " samples" +
      (c.cohesion === null || c.cohesion === undefined ? "" :
        " · cohesion " + c.cohesion) + "</span>";
    if (!isNone && c.cohesion !== null && c.cohesion !== undefined) {
      var w = Math.max(0, Math.min(100, Math.round(c.cohesion * 100)));
      h += "<span class='bar'><i style='width:" + w + "%'></i></span>";
    }
    if (!isNone) {
      h += "<span class='nm'><input id='n" + c.id + "' placeholder='name this cluster' value='" +
        esc(labels[c.id] || "") + "'><button data-id='" + c.id + "'>Save</button></span>";
    }
    h += "</div><div class='geo' style='padding:8px 16px 0'>" + esc(geo) + "</div>";
    h += "<div class='grid'>";
    (c.members || []).forEach(function (m) {
      var t = thumb(m.shot);
      h += "<div class='shot'>" +
        (t ? "<img loading='lazy' src='" + esc(t) + "' onerror=\"this.onerror=null;this.src='" +
             esc(m.shot || "") + "'\">" : "<img alt='no screenshot'>") +
        "<div class='cap'>" + esc(m.shot || "") +
        (m.sil === null || m.sil === undefined ? "" : " · " + m.sil) +
        "</div></div>";
    });
    h += "</div></div>";
    return h;
  }

  document.getElementById("out").innerHTML = clusters.map(block).join("");

  document.getElementById("out").addEventListener("click", function (e) {
    var id = e.target && e.target.getAttribute && e.target.getAttribute("data-id");
    if (id === null || id === undefined) { return; }
    var box = document.getElementById("n" + id);
    var v = box ? box.value.trim() : "";
    if (v) { labels[id] = v; } else { delete labels[id]; }
    try { localStorage.setItem("arkui.names." + D.session, JSON.stringify(labels)); }
    catch (err) { /* private window: the download is the real save */ }
    e.target.textContent = "Saved";
    setTimeout(function () { e.target.textContent = "Save"; }, 900);
  });

  document.getElementById("dl").onclick = function () {
    var blob = new Blob([JSON.stringify(labels, null, 2)], {type: "application/json"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "names.json";
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  };
})();
</script>
</body>
</html>
